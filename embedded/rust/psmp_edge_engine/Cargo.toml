[package]
name = "psmp-edge-engine"
version = "0.1.0"
edition = "2021"
authors = ["PSMP Project Team"]
description = "Deterministic zero-allocation parking prediction and state transition engine for Qualcomm QC8255 (SA8255P)"
license = "MIT OR Apache-2.0"

[dependencies]

[lib]
crate-type = ["lib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
